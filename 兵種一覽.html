var STATS = ['HP', '力', '魔力', '速さ', '技', '守備', '魔防', '幸運', '魅力'];
var MOV_ZH = { '歩兵': '步兵', '騎兵': '騎兵', '飛行': '飛行', '重装': '重裝' };
var STORE = 'fe-class-state';
var S = { sort: null, dir: -1 };
try { Object.assign(S, JSON.parse(localStorage.getItem(STORE)) || {}); } catch (e) {}
function save() {
    try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {}
}
function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
CLASSES.forEach(function (c, i) {
    c.idx = i;
    c.sum = c.st.reduce(function (a, x) { return a + x; }, 0);
});

function buildHead() {
    var hd = '<th></th><th>兵種</th><th>階級</th><th>特性</th><th>移動</th>';
    STATS.concat(['合計']).forEach(function (n, i) {
        hd += '<th class="sort' + (S.sort === i ? (S.dir < 0 ? ' desc' : ' asc') : '') + '" data-i="' + i + '">' + n + '</th>';
    });
    hd += '<th>可用技能</th><th>兵種技能</th><th>精通技能</th><th>轉職考試／技能EXP加成</th><th>解放條件</th>';
    document.getElementById('head').innerHTML = hd;
}
function tips(list) {
    if (list.length === 0) { return '<span class="none">—</span>'; }
    return list.map(function (n) { return '<span class="tip" data-n="' + esc(n) + '">' + esc(n) + '</span>'; }).join('<br>');
}
function render() {
    var list = CLASSES;
    if (S.sort !== null) {
        list = list.slice().sort(function (a, b) {
            var va = S.sort === 9 ? a.sum : a.st[S.sort], vb = S.sort === 9 ? b.sum : b.st[S.sort];
            return (va - vb) * S.dir || a.idx - b.idx;
        });
    }
    document.getElementById('tb').innerHTML = list.map(function (c) {
        var mv = c.mv.split(',').map(function (m) { return MOV_ZH[m] || m; }).join('・');
        var tx = (c.exam ? '<b>考試</b>' + esc(c.exam).replace(/\n/g, '<br>') : '') + (c.exp ? (c.exam ? '<br>' : '') + '<b>EXP</b>' + esc(c.exp) : '');
        return '<tr><td class="face">' + (c.img ? '<img src="' + c.img + '" alt="" loading="lazy">' : '') + '</td>'
            + '<td class="who"><a href="https://gamewith.jp/fefw/' + c.gw + '" target="_blank">' + esc(c.zh || c.ja) + '</a>' + (c.zh ? '<small>' + esc(c.ja) + '</small>' : '') + '</td>'
            + '<td class="c">' + esc(c.grade) + '</td><td class="c">' + esc(mv) + '</td><td class="c">' + esc(c.move) + '</td>'
            + c.st.map(function (x) { return '<td class="num' + (x > 0 ? ' p' : x < 0 ? ' m' : '') + '">' + (x > 0 ? '+' + x : x) + '</td>'; }).join('')
            + '<td class="num sum">' + c.sum + '</td>'
            + '<td class="tsk">' + c.tsk.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</td>'
            + '<td class="sk">' + tips(c.skill) + '</td><td class="sk">' + tips(c.master) + '</td>'
            + '<td class="tx">' + (tx || '<span class="none">—</span>') + '</td>'
            + '<td class="tx">' + (c.unlock ? esc(c.unlock).replace(/\n/g, '<br>') : '<span class="none">—</span>') + '</td></tr>';
    }).join('');
    document.getElementById('count').textContent = '共 ' + list.length + ' 種';
}
function refresh() {
    save();
    buildHead();
    render();
}

document.getElementById('f-unsort').addEventListener('click', function () { S.sort = null; refresh(); });
document.getElementById('head').addEventListener('click', function (ev) {
    var th = ev.target.closest('th.sort');
    if (th === null) { return; }
    var i = Number(th.dataset.i);
    // 同一欄依序：降冪 → 升冪 → 恢復原始順序
    if (S.sort !== i) { S.sort = i; S.dir = -1; } else if (S.dir < 0) { S.dir = 1; } else { S.sort = null; }
    refresh();
});

// 點技能名稱顯示說明，點其他地方關閉
var pop = document.getElementById('pop'), cur = null;
function closePop() {
    pop.style.display = 'none';
    if (cur !== null) { cur.classList.remove('on'); cur = null; }
}
document.addEventListener('click', function (ev) {
    var t = ev.target.closest('.tip');
    if (t === null) {
        if (pop.contains(ev.target) === false) { closePop(); }
        return;
    }
    if (t === cur) { closePop(); return; }
    closePop();
    pop.innerHTML = '<b>' + esc(t.dataset.n) + '</b>' + esc(TIPS[t.dataset.n] || '（無說明）');
    pop.style.display = 'block';
    var r = t.getBoundingClientRect();
    var left = Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 8);
    pop.style.left = Math.max(window.scrollX + 8, left) + 'px';
    pop.style.top = (r.bottom + window.scrollY + 4) + 'px';
    t.classList.add('on');
    cur = t;
});
document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { closePop(); }
});
refresh();
