<style>
:root { --cai: #6d9eeb; --die: #8e7cc3; --the: #e8c13f; --led: #d5a6bd; }
body { margin: 0; padding: 16px; background: #f4f5f7; color: #222; font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-size: 14px; }
h1 { font-size: 20px; margin: 0 0 8px; }
.note { font-size: 13px; color: #555; margin: 6px 0; line-height: 1.7; }

.row > .lb { width: 72px; color: #555; font-size: 13px; flex-shrink: 0; }
.chip { display: inline-block; padding: 3px 10px; border: 1px solid #bbb; border-radius: 14px; background: #fff; cursor: pointer; user-select: none; font-size: 13px; }

input[type=search] { padding: 5px 8px; border: 1px solid #aaa; border-radius: 4px; width: 200px; }
.btn { padding: 3px 10px; border: 1px solid #999; background: #fff; border-radius: 4px; cursor: pointer; font-size: 13px; }

.wrap { overflow-x: auto; }
table { border-collapse: collapse; background: #fff; min-width: 1200px; }

td.who { white-space: nowrap; }
td.who a { color: #0b57d0; text-decoration: none; font-weight: bold; }
td.who a:hover { text-decoration: underline; }
td.who small { display: block; color: #777; font-size: 12px; }
td.num { text-align: center; font-variant-numeric: tabular-nums; width: 38px; }
td.num.r { color: #d00; font-weight: bold; }
td.num.b { color: #1565c0; }
td.sum { font-weight: bold; }
td.tsk span { display: inline-block; margin: 1px 2px; padding: 0 6px; border-radius: 3px; background: #eef2f7; color: #4a6fa5; font-size: 12px; white-space: nowrap; }
td.sk { font-size: 12px; color: #444; max-width: 220px; line-height: 1.5; }
td.sk b { color: #222; font-weight: normal; font-size: 11px; background: #fff3cd; padding: 0 4px; border-radius: 3px; margin-right: 3px; }
td.sk b.bl { background: #f8d7da; }
td.join { font-size: 12px; line-height: 1.5; min-width: 170px; }
td.join .t { color: #666; }
td.join .no { color: #bbb; }
td.skl { font-size: 12px; min-width: 150px; }
td.skl .sum-line { color: #555; white-space: nowrap; }
td.skl .tg2 { margin-left: 4px; padding: 0 6px; border: 1px solid #aac; background: #fff; border-radius: 3px; cursor: pointer; font-size: 11px; color: #0b3d91; }
td.skl .lists { display: none; margin-top: 4px; line-height: 1.55; }

td.skl .grp { color: #888; font-size: 11px; margin-top: 3px; }
td.skl .it { white-space: nowrap; }
td.skl .cd { display: inline-block; min-width: 56px; color: #666; }
.tip { cursor: pointer; color: #0b3d91; border-bottom: 1px dotted #0b3d91; }
.tip:hover, .tip.on { background: #e3f2fd; }
tr.jump td { animation: jumpHi 2.5s ease-out; }
@keyframes jumpHi { 0%, 40% { background: #fff1a8; } 100% { background: transparent; } }
#pop { position: absolute; z-index: 60; display: none; max-width: 320px; padding: 8px 10px; background: #fff; border: 1px solid #90caf9; border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.18); font-size: 13px; line-height: 1.6; }
#pop b { display: block; color: #0b3d91; margin-bottom: 2px; }
#pop small { color: #777; margin-left: 6px; font-weight: normal; }

tr.fold td.who a { font-size: 13px; font-weight: normal; color: #6b7a99; }
tr.fold td.who small { display: inline; margin-left: 6px; }

}
// 特技・魔法欄：平常只顯示數量，展開後才列出內容
function sklList(title, list) {
    if (list.length === 0) { return ''; }
    return '<div class="grp">' + title + '</div>' + list.map(function (x) {
        return '<div class="it"><span class="cd">' + esc(x[0]) + '</span><span class="tip" data-c="' + esc(x[0]) + '" data-e="' + esc(x[2]) + '">' + esc(x[1]) + '</span></div>';
    }).join('');
}
function skl(c) {
    var k = c.skl;
    var n = k.lv.length + k.sk.length + k.mg.length;
    if (n === 0) { return '<span class="no">—</span>'; }
    var open = S.sklOpen[c.id] !== undefined ? S.sklOpen[c.id] : S.sklAll;
    return '<div class="sum-line">特技 ' + (k.lv.length + k.sk.length) + '・魔法 ' + k.mg.length
        + '<button class="tg2 one" type="button">' + (open ? '收合' : '展開') + '</button></div>'
        + '<div class="lists">' + sklList('等級提升特技', k.lv) + sklList('專長提升特技', k.sk) + sklList('專長提升魔法', k.mg) + '</div>';
}
function render() {
    var list = CHARS.filter(function (c) { c._m = match(c); return c._m !== false; });
    if (S.sort !== null) {
        list = list.slice().sort(function (a, b) {
            var va = S.sort === 9 ? a.sum : (a.st[S.sort][0] || 0), vb = S.sort === 9 ? b.sum : (b.st[S.sort][0] || 0);
            return (va - vb) * S.dir;
        });
    }
    document.getElementById('tb').innerHTML = list.map(function (c) {
        var ck = chkOf()[c.id] === true;
        var j = c.sc[S.rt];
        var join = j === undefined ? '<span class="no">—</span>'
            : (j[0] ? '<span class="t">時期</span> ' + esc(j[0]) + '<br>' : '') + '<span class="t">條件</span> ' + esc(j[1] || '—')
              + (j[2] ? '<br><span class="t">交涉</span> ' + esc(j[2]) : '');
        var so = S.sklOpen[c.id] !== undefined ? S.sklOpen[c.id] : S.sklAll;
        return '<tr class="' + (ck ? 'chk' : '') + (c._m === 2 ? ' fold' : '') + (so ? ' open-skl' : '') + '" data-id="' + c.id + '">'
            + '<td class="ck"><input type="checkbox"' + (ck ? ' checked' : '') + '></td>'
            + '<td class="face"><img src="img/chara/chara_' + c.id + '.png" alt=""></td>'
            + '<td class="who"><a href="https://gamewith.jp/fefw/' + c.gw + '" target="_blank">' + esc(c.zh || c.ja) + '</a>' + (c.zh ? '<small>' + esc(c.ja) + '</small>' : '') + '</td>'
            + '<td class="num">' + esc(c.sex) + '</td>'
            + c.st.map(function (x) { return '<td class="num ' + x[1] + '">' + (x[0] === null ? '—' : x[0]) + '</td>'; }).join('')
            + '<td class="num sum">' + c.sum + '</td>'
            + '<td class="tsk">' + c.tsk.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</td>'
            + '<td class="sk">' + (c.ps ? '<b>個人</b>' + esc(c.ps) : '') + (c.lv ? '<br><b>等級</b>' + esc(c.lv) : '')
            + c.bl.map(function (x, i) { return '<br><b class="bl">血印' + (c.bl.length > 1 ? i + 1 : '') + '</b>' + esc(x); }).join('') + '</td>'
            + '<td class="skl">' + skl(c) + '</td>'
            + '<td class="join">' + join + '</td></tr>';
    }).join('');
    var folded = list.filter(function (c) { return c._m === 2; }).length;
    document.getElementById('count').textContent = '顯示 ' + list.length + ' ／ ' + CHARS.length + ' 人' + (folded ? '（其中縮小 ' + folded + ' 人）' : '');
}
function refresh() {
    save();
    buildFilters();
    buildHead();
    render();
}

function toggleIn(arr, v) {
    var i = arr.indexOf(v);
    if (i >= 0) { arr.splice(i, 1); } else { arr.push(v); }
}
document.getElementById('f-rt').addEventListener('click', function (ev) {
    var c = ev.target.closest('.chip');
    if (c) { S.rt = c.dataset.v; refresh(); }
});
document.getElementById('f-sex').addEventListener('click', function (ev) {
    var c = ev.target.closest('.chip');
    if (c) { toggleIn(S.sex, c.dataset.v); refresh(); }
});
document.getElementById('f-tsk').addEventListener('click', function (ev) {
    var c = ev.target.closest('.chip');
    if (c) { toggleIn(S.tsk, c.dataset.v); refresh(); }
});
document.getElementById('f-tsk-mode').addEventListener('click', function () { S.all = S.all === false; refresh(); });
document.getElementById('f-avail').addEventListener('change', function (ev) { S.avail = ev.target.checked; refresh(); });
document.getElementById('f-q').addEventListener('input', function (ev) { S.q = ev.target.value.trim(); save(); render(); });
document.getElementById('f-hide').addEventListener('change', function (ev) { S.hide = ev.target.checked; if (S.hide) { S.only = false; } refresh(); });
document.getElementById('f-only').addEventListener('change', function (ev) { S.only = ev.target.checked; if (S.only) { S.hide = false; } refresh(); });
document.getElementById('f-reset').addEventListener('click', function () {
    S.avail = false; S.sex = []; S.tsk = []; S.q = ''; S.hide = false; S.only = false; S.sort = null;
    refresh();
});
document.getElementById('f-unsort').addEventListener('click', function () { S.sort = null; refresh(); });
document.getElementById('head').addEventListener('click', function (ev) {
    var th = ev.target.closest('th.sort');
    if (th === null) { return; }
    var i = Number(th.dataset.i);
    // 同一欄依序：降冪 → 升冪 → 恢復原始順序
    if (S.sort !== i) { S.sort = i; S.dir = -1; } else if (S.dir < 0) { S.dir = 1; } else { S.sort = null; }
    refresh();
});
document.getElementById('tb').addEventListener('change', function (ev) {
    var tr = ev.target.closest('tr');
    var id = tr.dataset.id;
    if (ev.target.checked) { chkOf()[id] = true; } else { delete chkOf()[id]; }
    tr.classList.toggle('chk', ev.target.checked);
    save();
    if (S.hide || S.only) { render(); }
});
// 特技・魔法展開按鈕
document.getElementById('tb').addEventListener('click', function (ev) {
    var b = ev.target.closest('.tg2.one');
    if (b === null) { return; }
    var tr = b.closest('tr');
    var open = tr.classList.contains('open-skl') === false;
    tr.classList.toggle('open-skl', open);
    b.textContent = open ? '收合' : '展開';
    S.sklOpen[tr.dataset.id] = open;
    save();
});
document.getElementById('head').addEventListener('click', function (ev) {
    if (ev.target.id !== 'skl-all') { return; }
    S.sklAll = S.sklAll === false;
    S.sklOpen = {};
    refresh();
});
// 點特技、魔法名稱顯示說明
var pop = document.getElementById('pop'), cur = null;
function closePop() {
    pop.style.display = 'none';
    if (cur !== null) { cur.classList.remove('on'); cur = null; }
}
document.addEventListener('click', function (ev) {
    var t = ev.target.closest('.tip');
    if (t === null) {
        if (pop.contains(ev.target) === false) { closePop(); }
        return;
    }
    if (t === cur) { closePop(); return; }
    closePop();
    pop.innerHTML = '<b>' + esc(t.textContent) + '<small>' + esc(t.dataset.c) + '</small></b>' + (esc(t.dataset.e).replace(/\n/g, '<br>') || '（無說明）');
    pop.style.display = 'block';
    var r = t.getBoundingClientRect();
    var left = Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - pop.offsetWidth - 8);
    pop.style.left = Math.max(window.scrollX + 8, left) + 'px';
    pop.style.top = (r.bottom + window.scrollY + 4) + 'px';
    t.classList.add('on');
    cur = t;
});
document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { closePop(); }
});
// 從其他頁跳過來：#c=角色編號&rt=路線，切換路線並捲到該角色
function jump() {
    var p = new URLSearchParams(location.hash.slice(1));
    var id = p.get('c'), rt = p.get('rt');
    if (id === null) { return; }
    if (rt && ROUTES.some(function (r) { return r[0] === rt; })) { S.rt = rt; }
    var c = CHARS.filter(function (x) { return String(x.id) === id; })[0];
    if (c && match(c) === false) { S.sex = []; S.tsk = []; S.q = ''; }
    refresh();
    var tr = document.querySelector('#tb tr[data-id="' + id + '"]');
    if (tr) {
        tr.scrollIntoView({ block: 'center' });
        // 頭像載入後版面會位移，載入完再對齊一次
        window.addEventListener('load', function () { tr.scrollIntoView({ block: 'center' }); });
        setTimeout(function () { tr.scrollIntoView({ block: 'center' }); }, 400);
        tr.classList.add('jump');
        setTimeout(function () { tr.classList.remove('jump'); }, 2600);
    }
}
window.addEventListener('hashchange', jump);
refresh();
jump();
</script>
</body>
</html>
